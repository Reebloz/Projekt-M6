<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fresh Table | Recipe Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header class="hero">
        <nav class="top-nav">
            <a class="brand" href="/">Fresh Table</a>
            <a href="manage.html" class="nav-btn">Add Recipe</a>
        </nav>
        <div class="hero-content">
            <p class="eyebrow">HOME COOKING COLLECTION</p>
            <h1>Turn Everyday Ingredients Into Great Meals</h1>
            <p>
                Explore the full Fresh Table collection and discover new ideas for
                breakfast, lunch, dinner, and sweet treats.
            </p>
        </div>
    </header>

    <main class="container single-column">
        <section class="card recipes-card">
            <div class="section-head">
                <h2>All Recipes</h2>
                <div class="section-actions">
                    <button id="refresh-btn" class="secondary-btn" type="button">Refresh</button>
                </div>
            </div>
            <div id="recipes-list" class="recipes-list recipes-grid" aria-live="polite"></div>
        </section>
    </main>

    <script src="home.js"></script>
</body>

</html>
